name: Refresh IAM data and deploy

on:
  schedule:
    # Mondays 06:00 UTC. The SAR scrape upstream updates most weekdays; weekly
    # keeps the diff readable without missing much.
    - cron: "0 6 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Scheduled refresh. main is protected, so this goes through a PR, but the PR
  # is opened and merged with DATA_REFRESH_TOKEN (the owner's fine-grained PAT:
  # contents + pull-requests write on this repo) rather than github.token, for
  # two reasons that are easy to lose:
  #
  #   - A PR authored by github-actions[bot] hits the repo's first-time-
  #     contributor approval gate, so ci.yml sits in "approve and run" until a
  #     human clicks. One such run waited the full 30 days and expired.
  #   - A merge performed with github.token is a push by the bot, and pushes made
  #     with github.token do not trigger workflows -- the deploy job below would
  #     never fire. A PAT merge is an ordinary user push and does.
  #
  # The job waits for the required checks itself and merges explicitly rather
  # than relying on auto-merge, so a red check turns this run red and a
  # cancelled job simply leaves the PR for next week's run to reuse.
  refresh:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # Persisted as the git credential, so `git push` below is the owner.
          token: ${{ secrets.DATA_REFRESH_TOKEN }}

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Rebuild site data
        run: uv run python -m build.build

      - name: Install front-end test dependencies
        run: npm ci

      - name: Run tests
        run: |
          uv run --group dev pytest
          node --test tests/*.test.mjs

      - name: Open a PR if the data changed
        id: pr
        env:
          GH_TOKEN: ${{ secrets.DATA_REFRESH_TOKEN }}
        run: |
          # manifest.json carries the build timestamp, which changes every run.
          # Including it here would open a content-free PR every week and train
          # everyone to ignore them.
          DATA=(site/data ':(exclude)site/data/manifest.json')

          if git diff --quiet -- "${DATA[@]}"; then
            echo "No upstream changes."
            git checkout -- site/data
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH="data-refresh"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add site/data
          git commit -m "Refresh IAM data ($(date -u +%Y-%m-%d))"
          git push --force origin "$BRANCH"

          # Reuse the open PR if there is one, so weekly runs do not pile up.
          NUMBER="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')"
          if [ -z "$NUMBER" ]; then
            URL="$(gh pr create \
              --head "$BRANCH" \
              --title "Refresh IAM data" \
              --body "Automated rebuild from \`policies.js\` and the Service Authorization Reference.

          The diff below is what AWS changed upstream. It merges itself once CI passes, and merging redeploys the site.")"
            NUMBER="${URL##*/}"
          fi

          echo "PR #$NUMBER"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Wait for CI, then merge
        if: steps.pr.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.DATA_REFRESH_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          # The pull_request event lags the push by a few seconds, and
          # `gh pr checks --watch` errors out when no checks exist yet.
          for _ in $(seq 1 24); do
            COUNT="$(gh pr view "$PR" --json statusCheckRollup --jq '.statusCheckRollup | length')"
            if [ "${COUNT:-0}" -gt 0 ]; then
              break
            fi
            sleep 5
          done

          # Exits non-zero on a failed required check, which fails this job.
          gh pr checks "$PR" --required --watch --fail-fast

          gh pr merge "$PR" --squash --delete-branch

      # Opened by github.token on purpose: an issue the owner's own token created
      # would not notify the owner. A second failure comments on the open issue
      # instead of opening another.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          LABEL="data-refresh"
          gh label create "$LABEL" --force \
            --description "Opened automatically when the weekly IAM data refresh fails" \
            --color "B60205"

          BODY="The scheduled IAM data refresh failed: $RUN_URL"
          if [ -n "$PR" ]; then
            BODY="$BODY

          Pull request: #$PR"
          fi

          EXISTING="$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number')"
          if [ -z "$EXISTING" ]; then
            gh issue create \
              --title "Weekly IAM data refresh failed" \
              --label "$LABEL" \
              --body "$BODY

          Close this issue once the cause is fixed. Repeated failures comment here rather than opening new issues."
          else
            gh issue comment "$EXISTING" --body "$BODY"
          fi

  # Deploys whatever is committed on main. Deliberately does not rebuild --
  # the committed shards are the source of truth for what is live.
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
