name: Refresh IAM data and deploy

on:
  schedule:
    # Mondays 06:00 UTC. The SAR scrape upstream updates most weekdays; weekly
    # keeps the diff readable without missing much.
    - cron: "0 6 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Rebuild site data
        run: uv run python -m build.build

      - name: Run tests
        run: uv run --group dev pytest

      # Committing the shards keeps the AWS changes visible in the repo history
      # -- the weekly diff is a readable log of what AWS added or removed.
      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --staged --quiet; then
            echo "No upstream changes."
          else
            git commit -m "Refresh IAM data ($(date -u +%Y-%m-%d))"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
