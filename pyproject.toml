[project]
name = "aws-policy-visual-articulator"
version = "0.2.0"
description = "Browse and generate AWS IAM policies from a static site"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.28.1",
  "loguru>=0.7.3",
  "pydantic>=2.11.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.9.0",
  "pyright>=1.1.390",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"

[tool.pyright]
include = ["build", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
